name: Android APK Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_API_URL: https://viralclip-ai-mvse.onrender.com
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ViralClip-AI.apk
          cd ..

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViralClip-AI-Android-APK
          path: ViralClip-AI.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ViralClip AI Android (Latest)
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: ViralClip-AI.apk
          fail_on_unmatched_files: true
